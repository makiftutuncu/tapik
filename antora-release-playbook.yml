site:
  title: tapik
  url: https://tapik.akif.dev
content:
  edit_url: https://github.com/makiftutuncu/tapik/edit/{refname}/{path}
  sources:
    - url: .
      branches: []
      tags:
        - v*
        - '!v0.1.*'
        - '!v0.2.0'
      start_path: docs
ui:
  bundle:
    url: ./site/target/antora-ui-bundle.zip
    snapshot: true
  supplemental_files: ./site/supplemental-ui
antora:
  extensions:
    - require: ./site/scripts/normalize-documentation-components.cjs
      legacy_component: tapik
      component: docs
    - require: '@antora/collector-extension'
    - require: '@antora/lunr-extension'
      index_latest_only: true
output:
  clean: false
  dir: site/target/site
