name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: |
            pom.xml
            **/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Install artifacts for site validation
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests install

      - name: Build website and API reference
        run: ./mvnw --batch-mode --no-transfer-progress -f site/pom.xml package

      - name: Build narrative documentation
        run: |
          npm ci
          npm run docs:preview
