name: Rehearse release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
          cache-disabled: true
      - name: Package and consume the unsigned release
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Prelease
          -Dgpg.skip=true -Dcentral.skipPublishing=true
          -Dtapik.release.rehearsal=true clean install
      - name: Retain Maven rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-release-rehearsal
          path: |
            example-application/target/release-*.txt
            example-application/target/release-consumer.log
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Package and consume the Gradle plugin
        run: ./scripts/verify-gradle.sh
        env:
          GRADLE: gradle
      - name: Retain Gradle rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-rehearsal
          path: |
            target/gradle-verification/external-consumer.log
            target/gradle-verification/external-consumer.txt
            target/gradle-verification/repository/dev/akif/tapik-plugin-gradle
            plugin-gradle/build/reports
            plugin-gradle/build/test-results
          if-no-files-found: ignore
          retention-days: 7
