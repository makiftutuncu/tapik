name: Rehearse release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Package and consume the unsigned release
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Prelease
          -Dgpg.skip=true -Dcentral.skipPublishing=true
          -Dtapik.release.rehearsal=true clean install
      - name: Retain rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal
          path: |
            example-application/target/release-*.txt
            example-application/target/release-consumer.log
            **/target/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 7
