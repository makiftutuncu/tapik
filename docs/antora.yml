name: docs
title: tapik
version: v0.6.0
nav:
  - modules/ROOT/nav.adoc
ext:
  collector:
    scan:
      - dir: example-contract
        files: pom.xml
        into: modules/ROOT/examples/contract
      - dir: example-contract/src/main/kotlin/com/example/library/contract
        files: Books.kt
        into: modules/ROOT/examples/contract
      - dir: example-application
        files: pom.xml
        into: modules/ROOT/examples/application
      - dir: example-application/src/main/kotlin/com/example/library/application
        files: '*.kt'
        into: modules/ROOT/examples/application
      - dir: example-contract
        files: build.gradle.kts
        into: modules/ROOT/examples/gradle/contract
      - dir: example-application
        files: build.gradle.kts
        into: modules/ROOT/examples/gradle/application
      - dir: example-gradle
        files: settings.gradle.kts
        into: modules/ROOT/examples/gradle
      - dir: plugin-gradle/src/test/resources/examples/gradle
        files: '*'
        into: modules/ROOT/examples/gradle/dsl
      - dir: test-fixtures/src/main/kotlin/test/fixtures/library
        files: Identifiers.kt
        into: modules/ROOT/examples/dsl/library
      - dir: test-fixtures/src/main/kotlin/test/fixtures/library
        files: Library.kt
        into: modules/ROOT/examples/dsl/library
      - dir: test-fixtures/src/test/kotlin/test/fixtures/documentation
        files: '*Examples.kt'
        into: modules/ROOT/examples/dsl
